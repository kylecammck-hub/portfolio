name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and typecheck
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
